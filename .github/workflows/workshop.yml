name: Workshop checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/verify_publication.py
      - run: python -m pip install -r workshops/switchyard-routing/requirements.txt
      - run: python -m pytest tests -q
        working-directory: workshops/switchyard-routing
      - run: python scripts/replay_notebooks.py
